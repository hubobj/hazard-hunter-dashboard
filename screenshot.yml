name: Capture Hazard Board

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  screenshot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Create Capture Script
        run: |

          cat <<'EOF' > capture.js

          const { chromium } = require('playwright');

          (async () => {

            const browser =
              await chromium.launch({
                headless: true
              });

            const page =
              await browser.newPage({

                viewport:{
                  width:1920,
                  height:1080
                }

              });

            await page.goto(
              'https://game.safexcel.com/?view=board&room=safexcel-tpha',
              {
                waitUntil:'networkidle',
                timeout:120000
              }
            );

            await page.waitForTimeout(10000);

            await page.screenshot({

              path:'latest.png',

              fullPage:true

            });

            await browser.close();

          })();

          EOF

          node capture.js

      - name: Commit Screenshot
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add latest.png

          git diff --staged --quiet || \
          git commit -m "update screenshot"

          git push
