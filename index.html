<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Hazard Hunter Dashboard</title>

<style>

body{
    font-family:Segoe UI;
    background:#f5f7fa;
    margin:20px;
}

h1{
    text-align:center;
}

.cards{
    display:flex;
    gap:20px;
}

.card{
    flex:1;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.value{
    font-size:40px;
    color:#0078d4;
}

.panel{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    padding:10px;
    border-bottom:1px solid #ddd;
}

</style>
</head>
<body>

<h1>Hazard Hunter Live Board</h1>

<div class="cards">

<div class="card">
<div class="value" id="participants">0</div>
Participants
</div>

<div class="card">
<div class="value" id="found">0</div>
Hazards Found
</div>

<div class="card">
<div class="value" id="inspected">0</div>
Inspected
</div>

</div>

<div class="panel">

<h2>Top Hunters</h2>

<table id="hunters">

<tr>
<th>Rank</th>
<th>Name</th>
<th>Effective</th>
<th>Found</th>
</tr>

</table>

</div>

<div class="panel">

<h2>Recent Finds</h2>

<table id="finds">

<tr>
<th>User</th>
<th>Hazard</th>
<th>Time</th>
</tr>

</table>

</div>

<script>

async function refreshBoard()
{
 const response = await fetch(
  'https://rpouqucqhgqbjhfymctl.supabase.co/functions/v1/hazard-board',
  {
   method:'POST',
   headers:{
    'Content-Type':'application/json'
   },
   body:JSON.stringify({
    room:'safexcel-tpha'
   })
  }
 );

 const data = await response.json();

 document.getElementById('participants').innerText =
 data.board.totals.participants;

 document.getElementById('found').innerText =
 data.board.totals.found;

 document.getElementById('inspected').innerText =
 data.board.totals.inspected;


 let hunters=`
 <tr>
 <th>Rank</th>
 <th>Name</th>
 <th>Effective</th>
 <th>Found</th>
 </tr>`;

 data.board.topHunters.forEach((p,index)=>{
 hunters+=`
 <tr>
 <td>${index+1}</td>
 <td>${p.name}</td>
 <td>${p.effective}</td>
 <td>${p.found}</td>
 </tr>`;
 });

 document.getElementById('hunters').innerHTML = hunters;


 let finds=`
 <tr>
 <th>User</th>
 <th>Hazard</th>
 <th>Time</th>
 </tr>`;

 data.board.recentFinds.forEach(x=>{

 finds+=`
 <tr>
 <td>${x.name}</td>
 <td>${x.card.en}</td>
 <td>${new Date(x.at).toLocaleString()}</td>
 </tr>`;
 });

 document.getElementById('finds').innerHTML = finds;

}

refreshBoard();

setInterval(refreshBoard,30000);

</script>

</body>
</html>
