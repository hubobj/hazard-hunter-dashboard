<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hazard Hunter Live Board</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:#eef2f5;
    padding:15px;
    color:#222;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
}

.title h1{
    font-size:56px;
    margin-bottom:5px;
}

.title h2{
    color:#2aa7a5;
    font-weight:400;
}

.kpis{
    display:flex;
    gap:15px;
}

.kpi{
    width:170px;
    background:white;
    border-radius:15px;
    text-align:center;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.kpi .value{
    font-size:64px;
    color:#2aa7a5;
    font-weight:bold;
}

.kpi .label{
    font-size:28px;
}

.content{
    display:grid;
    grid-template-columns:72% 28%;
    gap:15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h2{
    margin-bottom:15px;
    font-size:36px;
}

.hazard-row{
    display:grid;
    grid-template-columns:330px 1fr 80px;
    align-items:center;
    gap:15px;
    margin-bottom:12px;
}

.bar-bg{
    background:#dfe3e8;
    height:22px;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:22px;
}

.orange{
    background:#f28c28;
}

.green{
    background:#47c765;
}

.rank-table{
    width:100%;
    border-collapse:collapse;
}

.rank-table td{
    padding:12px;
    font-size:28px;
}

.rank-table tr:nth-child(odd){
    background:#f9f5e7;
}

.rank{
    color:#c89400;
    font-weight:bold;
    width:50px;
}

.score{
    text-align:right;
    color:#2aa7a5;
    font-weight:bold;
}

.bottom{
    margin-top:15px;
    display:grid;
    grid-template-columns:80% 20%;
    gap:15px;
}

.finds{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.find-card{
    width:280px;
    display:flex;
    gap:10px;
    align-items:center;
    background:#eef7fb;
    border-radius:12px;
    padding:10px;
}

.find-card img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.find-title{
    font-weight:bold;
    font-size:24px;
}

.find-sub{
    color:#666;
}

.qr{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.qr img{
    width:220px;
}

.refresh{
    position:fixed;
    right:10px;
    bottom:10px;
    color:#999;
    font-size:12px;
}

</style>
</head>

<body>

<div class="header">

    <div class="title">
        <h1>Hazard Hunter • Live Board</h1>
        <h2 id="theme">Commercial Building Fire Safety</h2>
    </div>

    <div class="kpis">

        <div class="kpi">
            <div class="value" id="inspected">0</div>
            <div class="label">Inspected</div>
        </div>

        <div class="kpi">
            <div class="value" id="found">0</div>
            <div class="label">Found</div>
        </div>

        <div class="kpi">
            <div class="value" id="participants">0</div>
            <div class="label">Participants</div>
        </div>

    </div>

</div>

<div class="content">

    <div class="card">
        <h2>Top Hazards</h2>

        <div id="hazards"></div>

    </div>

    <div>

        <div class="card">
            <h2>🏆 Hunter Board</h2>

            <table class="rank-table" id="hunters"></table>

        </div>

    </div>

</div>

<div class="bottom">

    <div class="card">

        <h2>Latest Finds</h2>

        <div
