name: Capture Hazard Board v3

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 的 cron 是 UTC 时间，不是北京时间。
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: capture-hazard-board
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository (no actions/checkout)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "Cloning $REPO @ $REF"
          rm -rf repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git fetch --prune --tags
          git checkout -f "${REF}"
          git rev-parse --short HEAD

      - name: Setup Node.js 20 (no actions/setup-node)
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          # Ubuntu-latest 通常自带 node，但版本可能不是 20。
          # 这里用 NodeSource 安装 Node 20，避免依赖 setup-node action。
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg

          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg

          NODE_MAJOR=20
          echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_${NODE_MAJOR}.x nodistro main" | sudo tee /etc/apt/sources.list.d/nodesource.list

          sudo apt-get update
          sudo apt-get install -y nodejs

          node -v
          npm -v

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          # 确保有 package.json（你原来是 npm init -y）
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install --no-fund --no-audit playwright
          npx playwright install --with-deps chromium

      - name: Capture Screenshot
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          cat > shot.js << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1920, height: 1080 }
            });

            await page.goto(
              'https://game.safexcel.com/?view=board&room=safexcel-9dvu',
              { waitUntil: 'domcontentloaded', timeout: 120000 }
            );

            await page.waitForTimeout(15000);

            await page.screenshot({
              path: 'latest.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node shot.js
          ls -lh latest.png

      - name: Publish Screenshot (force orphan branch)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd repo

          if [ ! -s latest.png ]; then
            echo "latest.png missing or empty"
            exit 1
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          cp latest.png /tmp/latest.png

          # 重新绑 remote，确保 push 用 token
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          git branch -D screenshots 2>/dev/null || true
          git checkout --orphan screenshots
          git rm -rf . --quiet || true
          cp /tmp/latest.png latest.png

          git add latest.png
          git commit -m "update screenshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin screenshots
